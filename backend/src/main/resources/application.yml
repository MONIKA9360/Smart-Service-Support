# ─────────────────────────────────────────────────────────────────────────────
# Smart Service & Support Management System — Base Application Config
# ─────────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: Smart Service & Support Management System

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none          # We manage schema via db/schema.sql
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ── File Upload Limits ──────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /api

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
  info:
    title: Smart Service & Support Management System API
    version: 1.0.0
    description: REST API for the Smart Service & Support Management System

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.example.support: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

# ── Application Custom Properties ─────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:changeme-this-is-a-very-long-secret-key-for-development-only}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size-mb: ${FILE_MAX_SIZE_MB:10}
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
